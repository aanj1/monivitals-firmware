; MoniVitals — ESP32-C3 Super Mini + MAX30102 (I2C PPG)
;
; Build:  pio run
; Flash:  pio run -t upload
; Logs:   pio device monitor -b 115200

[env:esp32c3_supermini]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
; Super Mini often uses native USB-Serial/JTAG
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
upload_speed = 921600
build_flags =
    -DSB_DEVICE_NAME_PREFIX=\"MoniVitals\"
    ; Safer Super Mini I2C (avoid strapping GPIO8/9). Override if your wiring differs.
    -DSB_PIN_I2C_SDA=6
    -DSB_PIN_I2C_SCL=7
    -DSB_PIN_MAX30102_INT=5
